<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-dark@5.0.15/dark.min.css">
  <link rel="stylesheet" href="src/main.css">
  
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.1/dist/sweetalert2.all.min.js"></script>
  <script src="src/main.js" defer></script>
</head>
<body>
  <div class="fullBody">
    <div class="container">
      <div class="input-group">
        <label for="inputJson">Entrada:</label>
        <textarea id="inputJson" class="large-area large-area--input" placeholder="Insira o JSON aqui..."></textarea>
      </div>

      <div class="controls">
        <button type="button" class="controls__button controls__button--format">Formatar</button>
        <button type="button" class="controls__button controls__button--minify">Minify</button>
      </div>

      <div class="output-group">
        <label for="outputJson">Resultado:</label>
        <textarea id="outputJson" readonly class="large-area large-area--output" placeholder="..."></textarea>
      </div>
    </div>

    <div class="history" id="history">
      </div>
  </div>
</body>
</html>
